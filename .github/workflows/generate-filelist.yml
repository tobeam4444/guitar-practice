name: Generate File List

# music 또는 sheets 폴더에 변경사항이 있을 때 자동 실행
on:
  push:
    paths:
      - 'music/**'
      - 'sheets/**'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  generate-filelist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run generate_filelist.py
        run: python generate_filelist.py
      
      - name: Check if filelist.json changed
        id: check_changes
        run: |
          if git diff --quiet filelist.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push filelist.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add filelist.json
          git commit -m "🎵 Auto-update filelist.json"
          git push
